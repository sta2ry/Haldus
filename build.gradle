allprojects {
  group = 'org.featx.sta2ry.haldus'
  version = '1.0.0-SNAPSHOT'

  repositories {
    mavenCentral()
    maven {
      url = uri("https://oss.sonatype.org/content/repositories/snapshots")
      mavenContent {snapshotsOnly()}
    }
    maven {
      url = uri("${MVN_RELEASE}")
      credentials {
        username = "${MVN_USERNAME}"
        password = "${MVN_PASSWORD}"
      }
    }
    maven {
      url = uri("${MVN_SNAPSHOTS}")
      credentials {
        username = "${MVN_USERNAME}"
        password = "${MVN_PASSWORD}"
      }
    }
  }

  tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
      events 'PASSED', 'FAILED', 'SKIPPED'
    }
  }
}
