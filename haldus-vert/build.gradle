plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
}

application {
    mainClass.set("org.featx.sta2ry.haldus.MainVerticleKt")
}

def mainVerticleName = 'org.featx.sta2ry.haldus.MainVerticle'
def watchForChange = 'src/**/*'
def doOnChange = './gradlew classes'

dependencies {
    implementation("org.featx.spec:spec:${featxSpecVersion}")
    implementation(project(":haldus-spec"))
    implementation(project(":haldus-data"))
    implementation(project(":haldus-norm"))

    implementation(platform("io.vertx:vertx-stack-depchain:$vertxVersion"))
    implementation("io.vertx:vertx-service-discovery")
    implementation("io.vertx:vertx-config")
    implementation("io.vertx:vertx-config-consul")
    implementation("io.vertx:vertx-consul-client")
    implementation("io.vertx:vertx-circuit-breaker")
    implementation("io.vertx:vertx-health-check")

    implementation("io.vertx:vertx-web")
//  implementation("io.vertx:vertx-web-api-contract")
    implementation("io.vertx:vertx-web-sstore-redis")
//  implementation("io.vertx:vertx-web-openapi")
    implementation("io.vertx:vertx-web-client")
    implementation("io.vertx:vertx-web-validation")

    implementation("io.vertx:vertx-redis-client")
    implementation("io.vertx:vertx-sql-client")
//  implementation("io.vertx:vertx-rx-java3")
//  implementation("io.vertx:vertx-reactive-streams")
    implementation("com.google.inject:guice:7.0.0")
    implementation("com.google.dagger:dagger:$daggerVersion")

    implementation("io.vertx:vertx-lang-kotlin")
    implementation("io.vertx:vertx-lang-kotlin-coroutines")
    implementation("io.vertx:vertx-launcher-application")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    implementation("io.vertx:vertx-auth-jwt")
    implementation("io.vertx:vertx-auth-oauth2")
    implementation("at.favre.lib:bcrypt:0.10.2")

    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.22.3")

    testImplementation("io.vertx:vertx-junit5")
    testImplementation("org.junit.jupiter:junit-jupiter:$junitVersion")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:$junitVersion")
    testImplementation("org.junit.jupiter:junit-jupiter-api:$junitVersion")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "${javaVersion}"
    }
}

run {
    args = []
}

shadowJar {
    archiveClassifier.set("all")
    manifest {
        attributes 'Main-Verticle': mainVerticleName
    }
    mergeServiceFiles()
}
